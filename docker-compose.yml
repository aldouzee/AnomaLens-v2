services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./ml/artifacts:/app/artifacts:ro   # trained models mounted read-only
    environment:
      - ARTIFACTS_DIR=/app/artifacts
      - CORS_ORIGINS=http://localhost:5173

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
